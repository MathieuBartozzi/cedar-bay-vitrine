<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vitrine IA Cedar Bay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;600&family=Bricolage+Grotesque:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=Caveat:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Concept : le portail du conseil de Cedar Bay (vert cèdre) ouvre sur quatre sites d'éditeurs EdTech fictifs,
   chacun avec une identité « SaaS entreprise » distincte. Thème unique assumé : ce sont des sites commerciaux,
   chaque couleur est fixée explicitement. */
:root{
  color-scheme: light;
  --bar-h:50px;
  /* Portail du conseil */
  --hub-bg:#E8EDE9; --hub-paper:#FBFCFA; --hub-ink:#18261F; --hub-muted:#55655C; --hub-line:#C8D2CA;
  --hub-cedar:#2B5843; --hub-cedar2:#214634; --hub-tab:#E3A73F; --bar-bg:#121A16; --bar-fg:#E4EBE6; --bar-muted:#8E9E94; --bar-hi:#222E28;
  /* Correcta */
  --cr-ink:#0F1A33; --cr-ink2:#1E2B4D; --cr-paper:#FFFFFF; --cr-soft:#F4F6FA; --cr-soft2:#E9EDF5; --cr-red:#E1352B; --cr-redsoft:#FDECEA;
  --cr-line:#E0E5EE; --cr-muted:#59637D; --cr-sheet:#FFFEFB; --cr-rule:#DCE6F5; --cr-green:#18966A; --cr-greensoft:#E3F5EE; --cr-amber:#E39A2D; --cr-blue:#3A6BDD; --cr-onInkMuted:#AAB4CE;
  /* Lumi */
  --lu-night:#14113A; --lu-night2:#1F1A52; --lu-night3:#2A2468; --lu-indigo:#4E39D8; --lu-violet:#8A7BF5; --lu-amber:#FFB547; --lu-peach:#FF8F6B; --lu-mint:#2EBF9B;
  --lu-bg:#FAF9FF; --lu-alt:#F0EEFC; --lu-card:#FFFFFF; --lu-ink:#1B1740; --lu-muted:#5D5885; --lu-line:#E3E0F4; --lu-onNight:#F3F1FF; --lu-onNightMuted:#A9A4D4;
  --lu-h0:#ECE9FB; --lu-h1:#CFC7F7; --lu-h2:#A193EE; --lu-h3:#6B54E0; --lu-h4:#2EBF9B;
  /* Veriscript */
  --ve-bg:#0B131C; --ve-bg2:#0F1924; --ve-panel:#131F2B; --ve-panel2:#1A2837; --ve-line:#243548; --ve-fg:#E2E9F1; --ve-muted:#8A9AAF;
  --ve-ok:#36D39F; --ve-oksoft:#10362F; --ve-warn:#F2B84B; --ve-warnsoft:#3A2E14; --ve-red:#FF6B6B; --ve-redsoft:#3A1A1E; --ve-blue:#5B8CFF;
  /* Concierge */
  --co-green:#0C3831; --co-green2:#12473E; --co-green3:#1A5A4E; --co-ivory:#F7F3EA; --co-alt:#EEE7D7; --co-card:#FFFDF8; --co-brass:#B0854A; --co-brass2:#D8B57A;
  --co-brasssoft:#F2E7D2; --co-ink:#17221E; --co-muted:#58655F; --co-line:#E1D9C7; --co-onGreen:#F7F3EA; --co-onGreenMuted:#A7C0B8; --co-red:#B5472F;
  /* Polices */
  --f-hub:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hub-n:"Archivo Narrow", "Archivo", system-ui, sans-serif;
  --f-cr-d:"Bricolage Grotesque", "Archivo", system-ui, sans-serif;
  --f-cr:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-pen:"Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --f-lu:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-ve:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-ve-m:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-co-d:"Marcellus", Georgia, "Times New Roman", serif;
  --f-co:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* Variables de site (redéfinies par chaque éditeur) */
  --bg:var(--hub-bg); --alt:var(--hub-bg); --card:var(--hub-paper); --ink:var(--hub-ink); --muted:var(--hub-muted); --line:var(--hub-line);
  --acc:var(--hub-cedar); --on-acc:var(--hub-paper); --hi:var(--hub-cedar); --on-hi:var(--hub-paper); --hi-soft:var(--hub-bg); --stat:var(--hub-cedar);
  --cta-bg:var(--hub-cedar); --cta-fg:var(--hub-paper); --ghost-line:var(--hub-line);
  --fd:var(--f-hub); --fb:var(--f-hub); --fm:var(--f-mono); --fdw:700; --r:12px; --rb:8px; --ri:8px;
  --navbg:var(--hub-paper); --navfg:var(--hub-ink); --navmuted:var(--hub-muted); --navline:var(--hub-line); --navhover:var(--hub-bg);
  --heroBg:var(--hub-bg); --heroFg:var(--hub-ink); --heroMuted:var(--hub-muted); --pill-bg:var(--hub-paper); --pill-line:var(--hub-line);
  --dark:var(--hub-ink); --onDark:var(--hub-paper); --onDarkMuted:var(--hub-line); --darkcard:var(--hub-cedar2); --darkline:var(--hub-cedar);
  --win-bg:var(--hub-paper); --win-bar:var(--hub-bg); --win-line:var(--hub-line); --win-fg:var(--hub-ink); --win-muted:var(--hub-muted); --win-dot:var(--hub-line);
  --win-shadow:0 30px 60px -30px rgba(0,0,0,.35);
  --footbg:var(--hub-ink); --footfg:var(--hub-paper); --footmuted:var(--hub-line); --footline:var(--hub-cedar);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--hub-bg);color:var(--hub-ink);font-family:var(--f-hub);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bar-bg)}
h1,h2,h3,h4{text-wrap:balance}
p{text-wrap:pretty}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hub-tab);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
@media (max-width:480px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===================== Barre du salon ===================== */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--bar-bg);color:var(--bar-fg)}
.bar-in{display:flex;align-items:flex-end;gap:14px;height:var(--bar-h);max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-home{align-self:center;font:600 12px/1.2 var(--f-hub-n);letter-spacing:.07em;text-transform:uppercase;color:var(--bar-fg);text-decoration:none;white-space:nowrap}
.bar-home small{display:block;color:var(--bar-muted);letter-spacing:.05em;font-weight:500}
.bar-tabs{display:flex;gap:3px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;align-self:stretch;align-items:flex-end}
.bar-tabs::-webkit-scrollbar{display:none}
.bar-tab{display:flex;align-items:center;gap:8px;padding:10px 14px 11px;border-radius:9px 9px 0 0;color:var(--bar-muted);text-decoration:none;font:500 14px/1 var(--f-hub);white-space:nowrap}
.bar-tab:hover{color:var(--bar-fg);background:var(--bar-hi)}
.bar-tab[aria-current="page"]{background:var(--bar-hi);color:var(--bar-fg);box-shadow:inset 0 2px 0 var(--hub-tab)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot-cr{background:var(--cr-red)} .dot-lu{background:var(--lu-amber)} .dot-ve{background:var(--ve-ok)} .dot-co{background:var(--co-brass2)}
.bar-choice{align-self:center;display:flex;align-items:center;gap:8px;border:1px solid var(--bar-hi);background:var(--bar-hi);color:var(--bar-fg);border-radius:999px;padding:7px 14px;font:500 13px/1 var(--f-hub);cursor:pointer;white-space:nowrap}
.bar-choice[data-empty="true"]{background:transparent;color:var(--bar-muted);cursor:default}
.bar-choice b{font-weight:700}
@media (max-width:720px){.bar-home small,.bar-choice .long{display:none}.bar-home{font-size:11px}}

/* ===================== Portail du conseil ===================== */
.hub-hero{background:var(--hub-cedar2);color:var(--hub-paper);position:relative;overflow:hidden}
.hub-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 400px at 85% -10%,rgba(227,167,63,.22),transparent 60%),repeating-linear-gradient(90deg,transparent 0 119px,rgba(255,255,255,.04) 119px 120px)}
.hub-hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;padding-block:54px 60px;align-items:end}
@media (max-width:900px){.hub-hero .wrap{grid-template-columns:1fr;padding-block:36px 40px;gap:28px}}
.hub-k{font:600 12px/1.3 var(--f-hub-n);letter-spacing:.1em;text-transform:uppercase;color:var(--hub-tab);margin:0 0 14px}
.hub-hero h1{font:800 clamp(34px,5vw,60px)/1 var(--f-hub);letter-spacing:-.035em;margin:0 0 20px;max-width:16ch}
.hub-hero p.lead{font-size:18px;line-height:1.6;color:#CFDCD4;max-width:58ch;margin:0}
.hub-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.14);border-radius:14px;overflow:hidden}
.hub-facts div{background:var(--hub-cedar2);padding:18px}
.hub-facts b{display:block;font:700 30px/1 var(--f-hub);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hub-facts span{display:block;margin-top:6px;font-size:13.5px;color:#BCCDC3;line-height:1.35}
.hub-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;padding-block:40px 20px;align-items:start}
@media (max-width:1000px){.hub-main{grid-template-columns:1fr}}
.memo{background:var(--hub-paper);border:1px solid var(--hub-line);border-radius:14px;padding:30px clamp(20px,4vw,40px);min-width:0}
.memo-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px;margin:0 0 22px;padding-bottom:18px;border-bottom:1px solid var(--hub-line)}
@media (max-width:560px){.memo-meta{grid-template-columns:1fr}}
.memo-meta div{display:flex;gap:10px;min-width:0}
.memo-meta dt{font:600 12px/1.6 var(--f-hub-n);letter-spacing:.07em;text-transform:uppercase;color:var(--hub-muted);width:52px;flex:none}
.memo-meta dd{margin:0;font-size:15px}
.memo h2{font:700 22px/1.2 var(--f-hub);margin:0 0 12px;letter-spacing:-.01em}
.memo p{margin:0 0 12px;font-size:16.5px;line-height:1.62;max-width:66ch}
.memo-sign{margin-top:18px!important;color:var(--hub-muted);font-size:15px!important}
.agenda{background:var(--hub-paper);border:1px solid var(--hub-line);border-radius:14px;padding:22px;min-width:0}
.agenda h3{font:600 12px/1 var(--f-hub-n);letter-spacing:.09em;text-transform:uppercase;color:var(--hub-muted);margin:0 0 14px}
.agenda ol{list-style:none;margin:0;padding:0;display:grid;gap:0}
.agenda li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--hub-line);font-size:14.5px;line-height:1.4}
.agenda li:first-child{border-top:0;padding-top:0}
.agenda time{font:600 13px/1.3 var(--f-hub-n);color:var(--hub-cedar);letter-spacing:.03em}
.agenda li.now time{color:var(--cr-red)}
.hub-h2{font:700 13px/1 var(--f-hub-n);letter-spacing:.09em;text-transform:uppercase;color:var(--hub-muted);margin:28px 0 16px;display:flex;align-items:center;gap:12px}
.hub-h2::after{content:"";flex:1;height:1px;background:var(--hub-line)}
.stands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.stands{grid-template-columns:1fr}}
.stand{position:relative;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;text-decoration:none;color:var(--hub-ink);background:var(--hub-paper);border:1px solid var(--hub-line);transition:transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s ease;min-width:0}
.stand:hover{transform:translateY(-4px);box-shadow:0 26px 44px -26px rgba(18,26,22,.55)}
.stand-vis{height:150px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:18px 20px}
.stand-vis .mini-logo{position:relative;z-index:1}
.stand-n{position:absolute;top:16px;right:18px;z-index:1;font:600 11.5px/1 var(--f-hub-n);letter-spacing:.09em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.16);color:inherit;backdrop-filter:blur(6px)}
.st-cr .stand-vis{background:linear-gradient(135deg,var(--cr-ink),var(--cr-ink2));color:var(--cr-paper)}
.st-cr .stand-vis::after{content:"";position:absolute;inset:0;background:radial-gradient(260px 160px at 85% 20%,rgba(225,53,43,.45),transparent 70%),repeating-linear-gradient(0deg,transparent 0 23px,rgba(255,255,255,.05) 23px 24px)}
.st-lu .stand-vis{background:linear-gradient(135deg,var(--lu-night),var(--lu-night3));color:var(--lu-onNight)}
.st-lu .stand-vis::after{content:"";position:absolute;inset:0;background:radial-gradient(240px 180px at 80% 110%,rgba(255,181,71,.55),transparent 70%),radial-gradient(200px 140px at 20% -10%,rgba(138,123,245,.5),transparent 70%)}
.st-ve .stand-vis{background:var(--ve-bg);color:var(--ve-fg)}
.st-ve .stand-vis::after{content:"";position:absolute;inset:0;background:radial-gradient(260px 160px at 80% 30%,rgba(54,211,159,.3),transparent 70%),linear-gradient(transparent 0 0),repeating-linear-gradient(90deg,transparent 0 31px,rgba(54,211,159,.07) 31px 32px)}
.st-co .stand-vis{background:linear-gradient(135deg,var(--co-green),var(--co-green3));color:var(--co-onGreen)}
.st-co .stand-vis::after{content:"";position:absolute;inset:0;background:radial-gradient(260px 180px at 85% 0%,rgba(216,181,122,.45),transparent 70%)}
.mini-logo{display:flex;align-items:center;gap:8px;font-size:24px;line-height:1}
.st-cr .mini-logo{font-family:var(--f-cr-d);font-weight:800;letter-spacing:-.03em}
.st-lu .mini-logo{font-family:var(--f-lu);font-weight:800;letter-spacing:-.03em}
.st-ve .mini-logo{font-family:var(--f-ve-m);font-weight:500;letter-spacing:.16em;font-size:18px}
.st-co .mini-logo{font-family:var(--f-co-d);font-size:26px}
.stand-body{padding:20px 20px 22px;display:flex;flex-direction:column;gap:14px;flex:1}
.stand-ask{margin:0;font-size:14px;color:var(--hub-muted);line-height:1.5}
.stand-ask b{font:600 11.5px/1 var(--f-hub-n);letter-spacing:.08em;text-transform:uppercase;color:var(--hub-ink);display:block;margin-bottom:6px}
.stand-promise{margin:0;font:600 19px/1.38 var(--f-hub);letter-spacing:-.008em}
.stand-free{display:inline-block;align-self:flex-start;background:var(--co-brasssoft);color:var(--co-green);font:600 12px/1 var(--f-hub-n);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:4px}
.stand-go{margin-top:auto;font:600 14px/1 var(--f-hub);color:var(--hub-cedar);display:flex;align-items:center;gap:6px}
.stand:hover .stand-go{gap:10px}
.steps{list-style:none;margin:34px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;counter-reset:st}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.steps li{counter-increment:st;border-top:2px solid var(--hub-ink);padding-top:14px;min-width:0}
.steps li::before{content:counter(st);font:800 34px/1 var(--f-hub);color:var(--hub-cedar);display:block;margin-bottom:8px;font-variant-numeric:tabular-nums}
.steps b{display:block;font-size:17px;margin-bottom:4px}
.steps span{color:var(--hub-muted);font-size:15px}
.hub-foot{margin-top:56px;background:var(--hub-paper);border-top:1px solid var(--hub-line)}
.fic{padding-block:22px;font-size:13px;color:var(--hub-muted);line-height:1.5}

/* ===================== Sites éditeurs : variables ===================== */
.site{background:var(--bg);color:var(--ink);font-family:var(--fb);overflow-x:clip}
.site-cr{--bg:var(--cr-paper);--alt:var(--cr-soft);--card:var(--cr-paper);--ink:var(--cr-ink);--muted:var(--cr-muted);--line:var(--cr-line);
  --acc:var(--cr-ink);--on-acc:var(--cr-paper);--hi:var(--cr-red);--on-hi:var(--cr-paper);--hi-soft:var(--cr-redsoft);--stat:var(--cr-ink);
  --cta-bg:var(--cr-ink);--cta-fg:var(--cr-paper);--ghost-line:var(--cr-line);
  --fd:var(--f-cr-d);--fb:var(--f-cr);--fm:var(--f-mono);--fdw:700;--r:14px;--rb:10px;--ri:10px;
  --navbg:rgba(255,255,255,.88);--navfg:var(--cr-ink);--navmuted:var(--cr-muted);--navline:var(--cr-line);--navhover:var(--cr-soft);
  --heroBg:var(--cr-paper);--heroFg:var(--cr-ink);--heroMuted:var(--cr-muted);--pill-bg:var(--cr-paper);--pill-line:var(--cr-line);
  --dark:var(--cr-ink);--onDark:var(--cr-paper);--onDarkMuted:var(--cr-onInkMuted);--darkcard:var(--cr-ink2);--darkline:#2C3A60;
  --win-bg:var(--cr-paper);--win-bar:var(--cr-soft);--win-line:var(--cr-line);--win-fg:var(--cr-ink);--win-muted:var(--cr-muted);--win-dot:#D5DBE6;
  --win-shadow:0 1px 0 var(--cr-line),0 40px 80px -40px rgba(15,26,51,.45);
  --footbg:var(--cr-ink);--footfg:var(--cr-paper);--footmuted:var(--cr-onInkMuted);--footline:#2C3A60}
.site-lu{--bg:var(--lu-bg);--alt:var(--lu-alt);--card:var(--lu-card);--ink:var(--lu-ink);--muted:var(--lu-muted);--line:var(--lu-line);
  --acc:var(--lu-indigo);--on-acc:#FFFFFF;--hi:var(--lu-indigo);--on-hi:#FFFFFF;--hi-soft:var(--lu-alt);--stat:var(--lu-indigo);
  --cta-bg:var(--lu-amber);--cta-fg:var(--lu-night);--ghost-line:rgba(255,255,255,.28);
  --fd:var(--f-lu);--fb:var(--f-lu);--fm:var(--f-mono);--fdw:800;--r:20px;--rb:999px;--ri:12px;
  --navbg:rgba(20,17,58,.86);--navfg:var(--lu-onNight);--navmuted:var(--lu-onNightMuted);--navline:rgba(255,255,255,.08);--navhover:rgba(255,255,255,.07);
  --heroBg:var(--lu-night);--heroFg:var(--lu-onNight);--heroMuted:var(--lu-onNightMuted);--pill-bg:rgba(255,255,255,.06);--pill-line:rgba(255,255,255,.12);
  --dark:var(--lu-night);--onDark:var(--lu-onNight);--onDarkMuted:var(--lu-onNightMuted);--darkcard:var(--lu-night2);--darkline:var(--lu-night3);
  --win-bg:var(--lu-card);--win-bar:var(--lu-alt);--win-line:var(--lu-line);--win-fg:var(--lu-ink);--win-muted:var(--lu-muted);--win-dot:#D8D3F2;
  --win-shadow:0 50px 90px -40px rgba(5,3,30,.75);
  --footbg:var(--lu-night);--footfg:var(--lu-onNight);--footmuted:var(--lu-onNightMuted);--footline:var(--lu-night3)}
.site-ve{--bg:var(--ve-bg);--alt:var(--ve-bg2);--card:var(--ve-panel);--ink:var(--ve-fg);--muted:var(--ve-muted);--line:var(--ve-line);
  --acc:var(--ve-ok);--on-acc:var(--ve-bg);--hi:var(--ve-ok);--on-hi:var(--ve-bg);--hi-soft:var(--ve-oksoft);--stat:var(--ve-ok);
  --cta-bg:var(--ve-ok);--cta-fg:var(--ve-bg);--ghost-line:var(--ve-line);
  --fd:var(--f-ve);--fb:var(--f-ve);--fm:var(--f-ve-m);--fdw:600;--r:10px;--rb:6px;--ri:6px;
  --navbg:rgba(11,19,28,.86);--navfg:var(--ve-fg);--navmuted:var(--ve-muted);--navline:var(--ve-line);--navhover:var(--ve-panel);
  --heroBg:var(--ve-bg);--heroFg:var(--ve-fg);--heroMuted:var(--ve-muted);--pill-bg:var(--ve-panel);--pill-line:var(--ve-line);
  --dark:#070D14;--onDark:var(--ve-fg);--onDarkMuted:var(--ve-muted);--darkcard:var(--ve-panel);--darkline:var(--ve-line);
  --win-bg:var(--ve-panel);--win-bar:var(--ve-bg2);--win-line:var(--ve-line);--win-fg:var(--ve-fg);--win-muted:var(--ve-muted);--win-dot:#2C3E53;
  --win-shadow:0 0 0 1px rgba(54,211,159,.06),0 50px 100px -40px rgba(0,0,0,.9);
  --footbg:#070D14;--footfg:var(--ve-fg);--footmuted:var(--ve-muted);--footline:var(--ve-line)}
.site-co{--bg:var(--co-ivory);--alt:var(--co-alt);--card:var(--co-card);--ink:var(--co-ink);--muted:var(--co-muted);--line:var(--co-line);
  --acc:var(--co-green);--on-acc:var(--co-onGreen);--hi:var(--co-brass);--on-hi:var(--co-green);--hi-soft:var(--co-brasssoft);--stat:var(--co-green);
  --cta-bg:var(--co-brass2);--cta-fg:var(--co-green);--ghost-line:rgba(247,243,234,.3);
  --fd:var(--f-co-d);--fb:var(--f-co);--fm:var(--f-mono);--fdw:400;--r:8px;--rb:4px;--ri:4px;
  --navbg:rgba(12,56,49,.9);--navfg:var(--co-onGreen);--navmuted:var(--co-onGreenMuted);--navline:rgba(255,255,255,.1);--navhover:rgba(255,255,255,.07);
  --heroBg:var(--co-green);--heroFg:var(--co-onGreen);--heroMuted:var(--co-onGreenMuted);--pill-bg:rgba(255,255,255,.06);--pill-line:rgba(216,181,122,.35);
  --dark:var(--co-green);--onDark:var(--co-onGreen);--onDarkMuted:var(--co-onGreenMuted);--darkcard:var(--co-green2);--darkline:var(--co-green3);
  --win-bg:var(--co-card);--win-bar:var(--co-ivory);--win-line:var(--co-line);--win-fg:var(--co-ink);--win-muted:var(--co-muted);--win-dot:#DDD3BF;
  --win-shadow:0 50px 90px -40px rgba(0,0,0,.6);
  --footbg:#08261F;--footfg:var(--co-onGreen);--footmuted:var(--co-onGreenMuted);--footline:var(--co-green2)}
/* Boutons d'appel dans les sections claires */
.site-lu .v-sec .btn-p,.site-lu .tier .btn-p{--cta-bg:var(--lu-indigo);--cta-fg:#FFFFFF}
.site-co .v-sec:not(.dark) .btn-p,.site-co .tier .btn-p{--cta-bg:var(--co-green);--cta-fg:var(--co-onGreen)}
.site-cr .v-sec.dark .btn-p,.site-cr .band .btn-p{--cta-bg:var(--cr-paper);--cta-fg:var(--cr-ink)}

/* ===================== Navigation éditeur ===================== */
.v-nav{position:relative;z-index:45;background:var(--navbg);color:var(--navfg);border-bottom:1px solid var(--navline);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px)}
@media (min-width:900px){.v-nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar-h))}}
.v-nav > .wrap{display:flex;align-items:center;gap:8px 20px;min-height:66px}
.v-logo{display:flex;align-items:center;gap:10px;flex:none;color:var(--navfg)}
.v-menu{display:flex;align-items:center;gap:2px;margin-left:10px}
.v-menu > button{background:none;border:0;color:var(--navmuted);font:500 14.5px/1 var(--fb);padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.v-menu > button:hover,.v-menu > button[aria-expanded="true"]{color:var(--navfg);background:var(--navhover)}
.chev{width:10px;height:10px;transition:transform .2s ease}
[aria-expanded="true"] > .chev{transform:rotate(180deg)}
.v-nav-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.v-nav-r .meta{font-size:13.5px;color:var(--navmuted);white-space:nowrap}
@media (max-width:1060px){.v-menu,.v-nav-r .meta{display:none}}
.dd{position:absolute;left:0;right:0;top:100%;background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 40px 70px -40px rgba(0,0,0,.45);animation:ddIn .18s ease both}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px)}}
.dd .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-block:16px 20px}
.dd button{text-align:left;background:none;border:0;padding:14px;border-radius:var(--ri);cursor:pointer;color:var(--ink);display:grid;gap:5px;grid-template-columns:36px minmax(0,1fr);align-items:start;column-gap:12px}
.dd button:hover{background:var(--alt)}
.dd .ico{width:36px;height:36px;grid-row:span 2}
.dd b{font-size:15px;font-weight:600}
.dd span.d{font-size:13.5px;color:var(--muted);line-height:1.45}

/* ===================== Boutons ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:var(--rb);padding:14px 22px;font:600 15px/1 var(--fb);cursor:pointer;transition:transform .18s ease, filter .18s ease, box-shadow .18s ease;white-space:nowrap;text-decoration:none}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn-p{background:var(--cta-bg);color:var(--cta-fg);box-shadow:0 10px 24px -14px rgba(0,0,0,.55)}
.btn-g{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px var(--ghost-line)}
.btn-sm{padding:10px 16px;font-size:14px}
.btn svg{width:16px;height:16px;flex:none}
.v-sec .btn-g{--ghost-line:var(--line)}

/* ===================== Héros ===================== */
.v-hero{position:relative;color:var(--heroFg);background:var(--heroBg);overflow:hidden;isolation:isolate}
.v-hero > .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.1fr);gap:56px;align-items:center;padding-block:76px 92px}
@media (max-width:1040px){.v-hero > .wrap{grid-template-columns:1fr;gap:44px;padding-block:44px 60px}}
.pill{display:inline-flex;align-items:center;gap:10px;font:500 13.5px/1.3 var(--fb);padding:5px 14px 5px 5px;border-radius:999px;background:var(--pill-bg);color:var(--heroFg);border:1px solid var(--pill-line);max-width:100%}
.pill b{flex:none;font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--hi);color:var(--on-hi);padding:5px 9px;border-radius:999px}
.pill span{min-width:0}
.v-h1{font-family:var(--fd);font-weight:var(--fdw);font-size:clamp(38px,5.3vw,70px);line-height:1;letter-spacing:-.035em;margin:24px 0 24px}
.v-lead{font-size:clamp(17px,1.45vw,19.5px);line-height:1.6;color:var(--heroMuted);max-width:54ch;margin:0}
.v-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.v-proof{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:30px;font-size:13.5px;color:var(--heroMuted)}
.v-proof span{display:flex;align-items:center;gap:7px}
.v-proof svg{width:15px;height:15px;color:var(--hi)}

/* ===================== Fenêtres d'application ===================== */
.win{background:var(--win-bg);border:1px solid var(--win-line);border-radius:14px;box-shadow:var(--win-shadow);overflow:hidden;min-width:0;color:var(--win-fg);position:relative}
.win-bar{display:flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:1px solid var(--win-line);background:var(--win-bar);font:500 12.5px/1 var(--fb);color:var(--win-muted)}
.win-bar i{width:10px;height:10px;border-radius:50%;background:var(--win-dot);flex:none}
.win-bar span{margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.win-bar em{margin-left:auto;font-style:normal;display:flex;align-items:center;gap:6px;white-space:nowrap}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* ===================== Bandeau de logos ===================== */
.marq{border-bottom:1px solid var(--line);background:var(--bg);overflow:hidden;padding-block:26px}
.marq p{text-align:center;margin:0 0 18px;font-size:13.5px;color:var(--muted)}
.marq-mask{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.marq-track{display:flex;gap:60px;width:max-content;animation:slide 46s linear infinite}
.marq-track span{font:700 19px/1 var(--fd);color:var(--muted);opacity:.7;white-space:nowrap;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.marq-track span i{width:18px;height:18px;border-radius:5px;background:currentColor;opacity:.45;display:inline-block}
@keyframes slide{to{transform:translateX(-50%)}}
.marq:hover .marq-track{animation-play-state:paused}

/* ===================== Sections ===================== */
.v-sec{padding-block:100px;scroll-margin-top:124px;position:relative}
@media (max-width:760px){.v-sec{padding-block:64px;scroll-margin-top:16px}}
.v-sec.alt{background:var(--alt)}
.v-sec.dark{background:var(--dark);color:var(--onDark)}
.v-sec.dark .v-sub,.v-sec.dark .muted{color:var(--onDarkMuted)}
.kicker{font:500 12.5px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--hi);margin:0 0 18px;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:18px;height:1.5px;background:currentColor}
.v-h2{font-family:var(--fd);font-weight:var(--fdw);font-size:clamp(30px,3.7vw,48px);line-height:1.05;letter-spacing:-.03em;margin:0 0 18px;max-width:20ch}
.v-sub{color:var(--muted);max-width:58ch;margin:0;line-height:1.62;font-size:18px}
.v-head{margin-bottom:52px}
.v-head.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px 64px;align-items:end}
.v-head.split .v-h2{margin:0}
@media (max-width:860px){.v-head.split{grid-template-columns:1fr}}
.muted{color:var(--muted)}

/* Onglets (visite produit) */
.tabs-list{position:relative;z-index:2;display:flex;gap:4px;flex-wrap:wrap;padding:5px;border-radius:calc(var(--rb) + 5px);background:var(--alt);border:1px solid var(--line);width:max-content;max-width:100%;margin-bottom:34px}
.v-sec.alt .tabs-list{background:var(--card)}
.v-sec.dark .tabs-list{background:var(--darkcard);border-color:var(--darkline)}
.tabs-list button{border:0;background:transparent;color:var(--muted);font:600 14.5px/1 var(--fb);padding:11px 16px;border-radius:var(--rb);cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .2s,color .2s}
.v-sec.dark .tabs-list button{color:var(--onDarkMuted)}
.tabs-list button[aria-selected="true"]{background:var(--acc);color:var(--on-acc);box-shadow:0 8px 18px -10px rgba(0,0,0,.5)}
.tabs-list button svg{width:16px;height:16px}
.tabs-list button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.tabs-list button *{pointer-events:none}
.tab-panel{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:52px;align-items:center}
.tab-panel:not([hidden]){animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) both}
@media (max-width:940px){.tab-panel{grid-template-columns:1fr;gap:30px}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.tab-copy h3{font:var(--fdw) clamp(24px,2.6vw,32px)/1.12 var(--fd);letter-spacing:-.02em;margin:0 0 14px}
.tab-copy p{margin:0 0 20px;color:var(--muted);line-height:1.62;font-size:16.5px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.checks li{display:flex;gap:11px;line-height:1.5;font-size:15.5px}
.checks li svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--hi)}

/* Cartes et grille bento */
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.bento > *{grid-column:span 2}
.bento > .w3{grid-column:span 3}
.bento > .w4{grid-column:span 4}
@media (max-width:940px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.bento > *,.bento > .w3{grid-column:span 1}.bento > .w4{grid-column:span 2}}
@media (max-width:600px){.bento{grid-template-columns:1fr}.bento > *,.bento > .w3,.bento > .w4{grid-column:span 1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;min-width:0;position:relative;overflow:hidden}
.v-sec.dark .card{background:var(--darkcard);border-color:var(--darkline)}
.card h3{font:var(--fdw) 20px/1.22 var(--fd);margin:18px 0 8px;letter-spacing:-.012em}
.card p{margin:0;color:var(--muted);line-height:1.6;font-size:15.5px}
.v-sec.dark .card p{color:var(--onDarkMuted)}
.ico{width:44px;height:44px;border-radius:var(--ri);display:grid;place-items:center;background:var(--hi-soft);color:var(--hi);flex:none}
.ico svg{width:22px;height:22px}
.tagline{display:inline-flex;font:500 11.5px/1 var(--fm);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:4px;background:var(--hi-soft);color:var(--hi);margin-top:16px}

/* Étapes horizontales */
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;counter-reset:fl;position:relative}
@media (max-width:900px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.flow{grid-template-columns:1fr}}
.flow li{counter-increment:fl;position:relative;padding:22px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);min-width:0}
.v-sec.dark .flow li{background:var(--darkcard);border-color:var(--darkline)}
.flow li::before{content:"0" counter(fl);font:500 13px/1 var(--fm);color:var(--hi);letter-spacing:.06em;display:block;margin-bottom:18px}
.flow b{display:block;font:var(--fdw) 19px/1.25 var(--fd);margin-bottom:8px}
.flow span{color:var(--muted);line-height:1.55;font-size:15px;display:block}
.v-sec.dark .flow span{color:var(--onDarkMuted)}
.flow em{display:inline-block;margin-top:14px;font:500 12px/1 var(--fm);font-style:normal;color:var(--hi)}

/* Chiffres */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.stats,.stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.stats,.stats.four{grid-template-columns:1fr}}
.stat{border-top:1px solid var(--line);padding-top:22px;min-width:0}
.v-sec.dark .stat{border-color:var(--darkline)}
.stat b{display:block;font:var(--fdw) clamp(46px,5.6vw,74px)/1 var(--fd);letter-spacing:-.045em;color:var(--stat);font-variant-numeric:tabular-nums;white-space:nowrap}
.v-sec.dark .stat b{color:var(--onDark)}
.stat span{display:block;margin-top:12px;color:var(--muted);line-height:1.45;max-width:30ch}
.v-sec.dark .stat span{color:var(--onDarkMuted)}
.fn{font-size:13px;color:var(--muted);margin:30px 0 0;line-height:1.5}
.v-sec.dark .fn{color:var(--onDarkMuted)}

/* Simulateur */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--card)}
@media (max-width:860px){.calc{grid-template-columns:1fr}}
.calc-in{padding:clamp(22px,4vw,44px);display:grid;gap:28px;align-content:center}
.rng label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600;font-size:15px;margin-bottom:12px}
.rng output{font:500 15px/1 var(--fm);color:var(--hi);font-variant-numeric:tabular-nums;white-space:nowrap}
.rng input[type=range]{width:100%;accent-color:var(--acc);height:22px;cursor:pointer}
.rng small{display:flex;justify-content:space-between;font:400 12px/1 var(--fm);color:var(--muted);margin-top:4px}
.calc-out{background:var(--dark);color:var(--onDark);padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;justify-content:center;gap:8px;position:relative;overflow:hidden}
.calc-out .lab{font:500 12.5px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--onDarkMuted)}
.calc-out .big{font:var(--fdw) clamp(54px,7vw,92px)/1 var(--fd);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.calc-out .unit{font-size:18px;color:var(--onDarkMuted);margin:0 0 20px}
.calc-out .sub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border-top:1px solid var(--darkline);padding-top:20px}
.calc-out .sub b{display:block;font:var(--fdw) 28px/1 var(--fd);font-variant-numeric:tabular-nums}
.calc-out .sub span{font-size:13.5px;color:var(--onDarkMuted)}
.calc-out .fn{margin-top:20px}

/* Étude de cas */
.case{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border-radius:var(--r);overflow:hidden;background:var(--dark);color:var(--onDark);border:1px solid var(--darkline)}
@media (max-width:860px){.case{grid-template-columns:1fr}}
.case-l{padding:clamp(24px,4vw,48px)}
.case-l .kicker{color:var(--hi)}
.case-l h3{font:var(--fdw) clamp(24px,2.8vw,34px)/1.15 var(--fd);letter-spacing:-.02em;margin:0 0 18px}
.case-l p{color:var(--onDarkMuted);line-height:1.62;margin:0 0 14px;font-size:16px}
.case-l blockquote{margin:24px 0 0;padding-left:18px;border-left:2px solid var(--hi);font-size:17px;line-height:1.5}
.case-l blockquote cite{display:block;margin-top:10px;font-style:normal;font-size:13.5px;color:var(--onDarkMuted)}
.case-r{background:var(--darkcard);padding:clamp(24px,4vw,48px);display:grid;gap:22px;align-content:center}
.case-r div{border-bottom:1px solid var(--darkline);padding-bottom:18px}
.case-r div:last-child{border:0;padding:0}
.case-r b{display:block;font:var(--fdw) clamp(36px,4vw,52px)/1 var(--fd);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.case-r span{color:var(--onDarkMuted);font-size:14.5px}

/* Témoignages */
.car{position:relative;min-width:0}
.car-slide[hidden]{display:none}
.car-slide:not([hidden]){animation:fadeUp .5s ease both}
.car-q{font:var(--fdw) clamp(22px,2.7vw,34px)/1.3 var(--fd);letter-spacing:-.02em;margin:0 0 28px;max-width:34ch}
.car-who{display:flex;align-items:center;gap:14px}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:600 15px/1 var(--fb);background:var(--hi-soft);color:var(--hi);flex:none}
.car-who b{display:block;font-size:15.5px}
.car-who span{font-size:14px;color:var(--muted)}
.v-sec.dark .car-who span{color:var(--onDarkMuted)}
.car-dots{display:flex;gap:8px;margin-top:34px}
.car-dots button{width:34px;height:4px;border-radius:4px;border:0;background:var(--line);cursor:pointer;padding:0;position:relative;overflow:hidden}
.v-sec.dark .car-dots button{background:var(--darkline)}
.car-dots button[aria-current="true"]::after{content:"";position:absolute;inset:0;background:var(--hi);transform-origin:left;animation:carBar 7s linear both}
@keyframes carBar{from{transform:scaleX(0)}}
.quote-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px;align-items:center}
@media (max-width:860px){.quote-grid{grid-template-columns:1fr;gap:32px}}
.rating{display:grid;gap:14px}
.rating .r{display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
.v-sec.dark .rating .r{background:var(--darkcard);border-color:var(--darkline)}
.rating .r b{font:var(--fdw) 34px/1 var(--fd);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rating .r span{font-size:14px;color:var(--muted);line-height:1.4}
.v-sec.dark .rating .r span{color:var(--onDarkMuted)}

/* Tarifs */
.bill{display:inline-flex;padding:5px;border-radius:999px;background:var(--alt);border:1px solid var(--line);gap:4px;margin-bottom:34px;flex-wrap:wrap}
.v-sec.alt .bill{background:var(--card)}
.bill button{border:0;background:transparent;border-radius:999px;padding:10px 16px;font:600 14px/1 var(--fb);color:var(--muted);cursor:pointer}
.bill button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}
.bill em{font-style:normal;margin-left:6px;opacity:.85}

.tbl-scene time{display:block;font-weight:700;color:var(--bar-fg);margin-bottom:4px}
.tbl-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.tbl-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:8px;border:1px solid #33433A;color:var(--bar-fg);text-decoration:none;font:600 14px/1 var(--f-hub);background:rgba(255,255,255,.04)}
.tbl-btn:hover{background:rgba(255,255,255,.09)}
.tbl-btn svg{width:15px;height:15px}
.tbl-body{padding-block:28px 64px}
.tbl .tab-panel:not([hidden]){display:block}
.tbl .tabs-list{margin-bottom:22px;background:var(--hub-paper)}
.tbl-intro{max-width:72ch;color:var(--hub-muted);font-size:16px;line-height:1.6;margin:0 0 22px}
.pieces{columns:2 380px;column-gap:18px}
.pc{break-inside:avoid;margin:0 0 18px;background:var(--hub-paper);border:1px solid var(--hub-line);border-radius:12px;overflow:hidden;box-shadow:0 12px 26px -22px rgba(18,26,22,.55);display:inline-block;width:100%}
.pc-tag{display:flex;justify-content:space-between;gap:6px 12px;padding:10px 16px;font:600 11.5px/1.3 var(--f-hub-n);letter-spacing:.07em;text-transform:uppercase;color:var(--hub-muted);background:var(--hub-bg);border-bottom:1px solid var(--hub-line);flex-wrap:wrap}
.pc-tag b{color:var(--hub-ink)}
.pc-body{padding:16px 18px 18px;font-size:15px;line-height:1.6;color:var(--hub-ink)}
.pc-body p{margin:0 0 10px}
.pc-body p:last-child{margin-bottom:0}
.pc-head{display:grid;grid-template-columns:58px minmax(0,1fr);gap:4px 10px;font-size:13.5px;padding-bottom:12px;margin:0 0 12px;border-bottom:1px solid var(--hub-line)}
.pc-head dt{color:var(--hub-muted)}
.pc-head dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pc-head .subj{font-weight:700}
.pc-legal .pc-body{font-family:Georgia,"Times New Roman",serif}
.pc-legal h4{font:700 12.5px/1.3 var(--f-hub);letter-spacing:.07em;text-transform:uppercase;margin:0 0 12px;color:var(--hub-ink)}
.pc-legal .cl{padding-left:14px;border-left:2px solid var(--hub-line);margin:10px 0}
.pc-legal .cl b{font-family:var(--f-hub);font-size:13px}
.pc-sig{margin-top:14px;padding-top:10px;border-top:1px dashed var(--hub-line);font:400 13px/1.5 var(--f-hub);color:var(--hub-muted)}
.pc-chat .msg{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;margin-bottom:14px}
.pc-chat .msg:last-of-type{margin-bottom:6px}
.pc-chat .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--f-hub);background:var(--hub-bg);color:var(--hub-cedar)}
.pc-chat .who{font-size:13px;color:var(--hub-muted)}
.pc-chat .who b{color:var(--hub-ink)}
.pc-chat .txt{margin-top:3px}
.pc-chat .seen{font-size:12px;color:var(--hub-muted);text-align:right;margin:0}
.pc-vendor .vhead{display:flex;align-items:center;gap:10px;padding:13px 18px;font-weight:700;font-size:15px}
.pc-vendor .vhead svg{width:20px;height:20px}
.pc-table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:300px}
.pc-table th,.pc-table td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--hub-line);vertical-align:top}
.pc-table th{font:600 11px/1.25 var(--f-hub-n);letter-spacing:.06em;text-transform:uppercase;color:var(--hub-muted)}
.pc-table td.n,.pc-table th.n{text-align:right;white-space:nowrap}
.pc-scroll{overflow-x:auto;margin:0 -4px}
.pc-shot{background:var(--hub-bg);border-radius:10px;padding:12px;display:grid;gap:8px;font-size:14px;margin:4px 0 10px}
.pc-shot .in{justify-self:start;background:var(--hub-paper);border:1px solid var(--hub-line);border-radius:12px 12px 12px 3px;padding:8px 11px;max-width:90%}
.pc-shot .out{justify-self:end;background:var(--co-green);color:var(--co-onGreen);border-radius:12px 12px 3px 12px;padding:8px 11px;max-width:90%}
.pc-shot .out.lu{background:var(--lu-night2);color:var(--lu-onNight)}
.pc-shot .t{justify-self:center;font:500 11px/1 var(--f-mono);color:var(--hub-muted)}
.pc-shot small{display:block;font-size:11.5px;opacity:.78;margin-top:4px}
.pc-note{font-size:13px;color:var(--hub-muted);font-style:italic}
.pc-stamp{display:inline-block;font:700 11px/1 var(--f-hub-n);letter-spacing:.1em;text-transform:uppercase;color:var(--cr-red);border:1.5px solid var(--cr-red);padding:5px 8px;border-radius:4px;transform:rotate(-2deg);margin-bottom:10px}

.fr-help{display:flex;gap:14px 20px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.fr-help p{margin:0;max-width:62ch;color:var(--hub-muted);font-size:15.5px;line-height:1.55}
.fr-actions{display:flex;gap:8px;flex-wrap:wrap}
.fr-actions button{border:1.5px solid var(--hub-line);background:var(--hub-paper);color:var(--hub-ink);border-radius:8px;padding:11px 14px;font:600 14px/1 var(--f-hub);cursor:pointer}
.fr-actions button.primary{background:var(--hub-cedar);border-color:var(--hub-cedar);color:var(--hub-paper)}
.fr-score{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:12px 16px;border-radius:10px;background:var(--hub-paper);border:1px solid var(--hub-line);font-size:15px}
.fr-score b{font:800 24px/1 var(--f-hub);font-variant-numeric:tabular-nums}
.frise{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.fc{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--hub-paper);border:1.5px solid var(--hub-line);border-radius:12px;padding:12px 12px 12px 14px;transition:border-color .2s, box-shadow .2s}
.fc.moved{animation:fadeUp .3s ease both}
.fc-n{font:800 22px/1 var(--f-hub);color:var(--hub-cedar);font-variant-numeric:tabular-nums;text-align:center}
.fc-t{font-size:15.5px;line-height:1.45;min-width:0}
.fc-k{display:inline-block;font:600 10.5px/1 var(--f-hub-n);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:4px;margin-bottom:6px;background:var(--hub-bg);color:var(--hub-muted)}
.fc-k.dec{background:#DFEDE5;color:var(--hub-cedar)}
.fc-k.ben{background:#E3EDF9;color:#2A579F}
.fc-k.sig{background:#FFF1CF;color:#875700}
.fc-k.evt{background:#ECE7F7;color:#5B3FA8}
.fc-k.cons,.fc-k.cri{background:#FBE3DE;color:#A2321C}
.fc-k.ctx{background:var(--hub-bg);color:var(--hub-muted)}
.fc-d{display:block;font:600 12.5px/1.3 var(--f-hub-n);letter-spacing:.03em;margin-top:7px;color:var(--hub-cedar)}
.fc.ko .fc-d{color:#A2321C}
.fc-ctl{display:flex;gap:5px}
.fc-ctl button{width:40px;height:40px;border-radius:9px;border:1px solid var(--hub-line);background:var(--hub-bg);color:var(--hub-ink);cursor:pointer;display:grid;place-items:center}
.fc-ctl button:disabled{opacity:.3;cursor:default}
.fc-ctl svg{width:15px;height:15px}
.fc-ctl .up svg{transform:rotate(180deg)}
.fc-ctl .flag[aria-pressed="true"]{background:var(--cr-red);border-color:var(--cr-red);color:#FFFFFF}
.fc.flagged{border-color:var(--cr-red);box-shadow:0 0 0 3px rgba(225,53,43,.12)}
.fc.ok{border-color:var(--hub-cedar)}
.fc.ko{border-style:dashed}
@media (max-width:560px){.fc{grid-template-columns:44px minmax(0,1fr);gap:8px 10px}.fc-grip{grid-row:1 / span 2}.fc-ctl{grid-column:2;justify-content:flex-end}}
/* Poignée de glisser-déposer */
.fc-grip{align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;margin:-12px 0 -12px -14px;padding:12px 0 12px 8px;border-radius:11px 0 0 11px;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.fc-grip .dots{width:10px;height:16px;fill:var(--hub-muted);opacity:.65}
.fc-grip:hover .dots{opacity:1}
@media (pointer:fine){.fc{cursor:grab}.fc button{cursor:pointer}}
.dragging-on .fc{transition:transform .18s cubic-bezier(.2,.7,.2,1), border-color .2s, box-shadow .2s}
.dragging-on{-webkit-user-select:none;user-select:none}
.fc.dragging{position:relative;z-index:5;transition:none;cursor:grabbing;border-color:var(--hub-cedar);box-shadow:0 22px 40px -18px rgba(18,26,22,.55)}
.fc.dragging .fc-grip{cursor:grabbing}
.clue.geo{background:#FFF7E6;box-shadow:inset 3px 0 0 var(--hub-tab)}
.fr-q{margin-top:22px;padding:18px 20px;border-radius:12px;background:var(--bar-bg);color:var(--bar-fg);font:600 17px/1.45 var(--f-hub)}
.fr-q small{display:block;font:600 11.5px/1.3 var(--f-hub-n);letter-spacing:.09em;text-transform:uppercase;color:var(--hub-tab);margin-bottom:6px}

/* ===================== Pilotage animateur ===================== */
.pilot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:26px 0 6px}
@media (max-width:940px){.pilot{grid-template-columns:1fr}}
.pilot > div{background:var(--hub-paper);border:1px solid var(--hub-line);border-radius:12px;padding:18px;min-width:0}
.pilot h3{font:600 12px/1.2 var(--f-hub-n);letter-spacing:.09em;text-transform:uppercase;color:var(--hub-muted);margin:0 0 12px}
.seg{display:inline-flex;padding:4px;border-radius:11px;background:var(--hub-bg);border:1px solid var(--hub-line);gap:4px;flex-wrap:wrap}
.seg button{border:0;border-radius:8px;padding:13px 18px;font:700 15px/1 var(--f-hub);background:transparent;color:var(--hub-muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--hub-ink);color:var(--hub-paper)}
.seg button[data-year-set="2028"][aria-pressed="true"]{background:var(--hub-tab);color:var(--bar-bg)}
.pilot p{margin:12px 0 0;font-size:14px;color:var(--hub-muted);line-height:1.55}
.pilot code{font:500 13px var(--f-mono);background:var(--hub-bg);padding:2px 6px;border-radius:4px;color:var(--hub-ink);overflow-wrap:anywhere}
.pilot .lk{display:grid;gap:2px}
.pilot .lk a{display:flex;justify-content:space-between;gap:10px;color:var(--hub-ink);font-weight:600;text-decoration:none;font-size:15px;padding:9px 0;border-bottom:1px solid var(--hub-line)}
.pilot .lk a:last-child{border-bottom:0}
.pilot .lk a span{color:var(--hub-muted);font-weight:500;font-size:13px;font-family:var(--f-mono)}
.sync{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-top:12px}
.sync::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--hub-line)}
.sync.on::before{background:#2FAE6E}
.big-code{display:inline-block;font:800 26px/1 var(--f-hub);letter-spacing:.06em;padding:10px 14px;border-radius:8px;background:var(--hub-bg);margin-top:4px}

/* ===================== Résultats des votes ===================== */
.rsv{padding-block:30px 60px;background:var(--hub-bg)}
.rs-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.rs-head h1{font:800 clamp(32px,5vw,58px)/1 var(--f-hub);letter-spacing:-.035em;margin:6px 0 0}
.rs-head .hub-k{color:var(--hub-cedar);margin:0}
.rs-total{font:600 16px/1.3 var(--f-hub);color:var(--hub-muted)}
.rs-total b{font-size:28px;color:var(--hub-ink);font-variant-numeric:tabular-nums}
.rs-bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:760px){.rs-bars{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.rs-col{background:var(--hub-paper);border:1px solid var(--hub-line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.rs-col h3{display:flex;align-items:center;gap:8px;margin:0;font:700 17px/1.2 var(--f-hub);min-width:0}
.rs-col h3 small{margin-left:auto;font:600 11.5px/1 var(--f-hub-n);letter-spacing:.07em;text-transform:uppercase;color:var(--hub-muted)}
.rs-track{position:relative;height:clamp(160px,32vh,320px);border-radius:12px;background:var(--hub-bg);overflow:hidden;display:flex;align-items:flex-end}
.rs-fill{width:100%;height:0;background:var(--c);transition:height .5s cubic-bezier(.2,.7,.2,1);border-radius:10px 10px 0 0}
.rs-cap{position:absolute;left:0;right:0;border-top:2px dashed var(--hub-ink);opacity:.55;transition:bottom .4s ease}
.rs-cap span{position:absolute;right:8px;top:-19px;font:600 10.5px/1 var(--f-hub-n);letter-spacing:.07em;text-transform:uppercase;color:var(--hub-ink)}
.rs-num{font:800 clamp(46px,7vw,84px)/1 var(--f-hub);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.rs-over{font-size:13px;color:#A2321C;font-weight:600;min-height:1.3em;margin:0}
.rs-ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rs-ctl button{height:50px;border-radius:10px;border:1.5px solid var(--hub-line);background:var(--hub-bg);font:700 24px/1 var(--f-hub);cursor:pointer;color:var(--hub-ink)}
.rs-ctl button.plus{background:var(--hub-ink);color:var(--hub-paper);border-color:var(--hub-ink)}
.rs-low{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:900px){.rs-low{grid-template-columns:1fr}}
.rs-box{background:var(--hub-paper);border:1px solid var(--hub-line);border-radius:16px;padding:20px;min-width:0}
.rs-box h2{font:700 20px/1.2 var(--f-hub);margin:0 0 14px}
.rs-r{display:grid;grid-template-columns:minmax(0,1fr) 40px auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--hub-line)}
.rs-r:first-of-type{border-top:0}
.rs-r .lbl{min-width:0}
.rs-r .lbl span{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
.rs-r .lbl i{display:block;height:8px;border-radius:999px;background:var(--hub-bg);overflow:hidden}
.rs-r .lbl u{display:block;height:100%;width:0;background:var(--hub-cedar);transition:width .4s ease}
.rs-r b{font:800 24px/1 var(--f-hub);text-align:right;font-variant-numeric:tabular-nums}
.rs-r .mini{display:flex;gap:4px}
.rs-r .mini button{width:36px;height:36px;border-radius:8px;border:1px solid var(--hub-line);background:var(--hub-bg);font:700 18px/1 var(--f-hub);cursor:pointer;color:var(--hub-ink)}
.rs-tools{display:grid;gap:12px;align-content:start}
.rs-tools .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.rs-tools .row b{font:800 22px/1 var(--f-hub);font-variant-numeric:tabular-nums;min-width:28px;text-align:center}
.rs-tools button{border:1.5px solid var(--hub-line);background:var(--hub-bg);color:var(--hub-ink);border-radius:8px;padding:10px 14px;font:600 14px/1 var(--f-hub);cursor:pointer}
.rs-tools button.warn{border-color:#EDB5A8;color:#A2321C;background:#FBE3DE}
.rs-tools .step{display:flex;gap:6px;align-items:center}
.rs-tools .step button{width:40px;height:40px;padding:0;font-size:18px}
.rs-tools p{margin:0;font-size:13.5px;color:var(--hub-muted);line-height:1.5}
.rsv.clean .rs-ctl,.rsv.clean .mini,.rsv.clean .rs-tools .ctl{display:none}

/* ===================== Code atelier ===================== */
.code-card{position:relative;width:100%;max-width:420px;background:var(--hub-paper);color:var(--hub-ink);border-radius:10px;padding:28px 24px 24px;box-shadow:0 40px 90px -30px rgba(0,0,0,.7);margin:auto;animation:fadeUp .3s ease both}
.code-card h2{font:800 24px/1.15 var(--f-hub);margin:0 0 8px;padding-right:40px}
.code-card p{margin:0 0 16px;color:var(--hub-muted);font-size:14.5px;line-height:1.5}
.code-card input{width:100%;font:700 22px/1 var(--f-hub);letter-spacing:.08em;text-transform:uppercase;padding:14px;border:1.5px solid var(--hub-line);border-radius:8px;background:var(--hub-paper);color:var(--hub-ink)}
.code-card .sign-btn{width:100%;margin-top:12px}
.code-msg{min-height:1.4em;margin:10px 0 0!important;font-weight:600}
.vd-send{display:inline-flex;align-items:center;gap:8px;border-radius:6px;padding:13px 18px;font:600 15px/1 var(--f-hub);background:var(--hub-tab);color:var(--bar-bg);text-decoration:none}

/* ===================== Impression (GitHub Pages : Ctrl+P) ===================== */
@media print{
  .bar,.v-nav,.no-print,.fr-actions,.fc-ctl,.tbl-links,.tabs-list,.notice,.sheet-bg,.verdict{display:none!important}
  body::before{display:none}
  body,.tbl{background:#FFFFFF}
  .tbl-hero{background:#FFFFFF;color:#000000;border-bottom:2px solid #000000}
  .tbl-scene,.tbl-scene time{color:#000000}
  .tbl .tab-panel[hidden]{display:block!important}
  .tbl .tab-panel + .tab-panel{break-before:page}
  .pieces{columns:1}
  .pc{box-shadow:none;break-inside:avoid}
  .frise{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .fc{grid-template-columns:1fr;border:1.5px dashed #000000;min-height:120px;break-inside:avoid}
  .fc-n,.fc-d,.fr-score,.fc-grip{display:none!important}
}
</style>
</head>

  if (EN) FR = FR_EN;
  var FR_START = [4, 0, 6, 2, 7, 1, 5, 3];
  var KF = 'cedarbay-frise-';

  function frLoad(id){ try { var s = JSON.parse(localStorage.getItem(KF + id) || 'null'); if (s && s.o && s.o.length === 8) return s; } catch(e){} return {o: FR_START.slice(), f: -1, v: false}; }
  function frSave(id){ try { localStorage.setItem(KF + id, JSON.stringify(FRS[id])); } catch(e){} }
  var GRIP = '<svg class="dots" viewBox="0 0 10 16" aria-hidden="true"><circle cx="2.5" cy="2.5" r="1.6"/><circle cx="7.5" cy="2.5" r="1.6"/><circle cx="2.5" cy="8" r="1.6"/><circle cx="7.5" cy="8" r="1.6"/><circle cx="2.5" cy="13.5" r="1.6"/><circle cx="7.5" cy="13.5" r="1.6"/></svg>';
  /* Glisser-déposer : au doigt par la poignée, à la souris depuis toute la carte */
  function frDragStart(id, box, li, e0){
    var items = qa('.fc', box), from = items.indexOf(li), to = from;
    var y0 = window.pageYOffset;
    var rects = items.map(function(el){ var r = el.getBoundingClientRect(); return {top: r.top + y0, h: r.height}; });
    var gap = items.length > 1 ? rects[1].top - (rects[0].top + rects[0].h) : 10;
    var step = rects[from].h + gap, startY = e0.clientY + y0, curY = e0.clientY, raf = null, moved = false;
    box.classList.add('dragging-on'); li.classList.add('dragging');
    try { li.setPointerCapture(e0.pointerId); } catch(err){}
    function update(){
      var dy = curY + window.pageYOffset - startY;
      if (Math.abs(dy) > 4) moved = true;
      li.style.transform = 'translateY(' + dy + 'px)';
      var c = rects[from].top + rects[from].h / 2 + dy, t = 0;
      rects.forEach(function(r, k){ if (k !== from && r.top + r.h / 2 < c) t++; });
      to = t;
      items.forEach(function(el, k){
        if (k === from) return;
        var sh = (k > from && k <= to) ? -step : (k < from && k >= to) ? step : 0;
        el.style.transform = sh ? 'translateY(' + sh + 'px)' : '';
      });
    }
    function edge(){
      raf = null;
      var vh = window.innerHeight, zone = 72, v = 0;
      if (curY < zone) v = -Math.ceil((zone - curY) / 5);
      else if (curY > vh - zone) v = Math.ceil((curY - (vh - zone)) / 5);
      if (v){ window.scrollBy(0, v); update(); raf = requestAnimationFrame(edge); }
    }
    function move(e){ curY = e.clientY; update(); if (!raf) raf = requestAnimationFrame(edge); if (e.cancelable) e.preventDefault(); }
    function end(){
      li.removeEventListener('pointermove', move); li.removeEventListener('pointerup', end); li.removeEventListener('pointercancel', end);
      if (raf) cancelAnimationFrame(raf);
      box.classList.remove('dragging-on');
      items.forEach(function(el){ el.style.transform = ''; el.classList.remove('dragging'); });
      if (moved && to !== from){
        var s = FRS[id], ci = s.o.splice(from, 1)[0]; s.o.splice(to, 0, ci); s.v = false;
        frSave(id); frRender(id, ci);
      }
    }
    li.addEventListener('pointermove', move); li.addEventListener('pointerup', end); li.addEventListener('pointercancel', end);
  }
  function frRender(id, movedCi){
    var s = FRS[id], data = FR[id], box = $('fr-' + id); if (!box) return;
    box.innerHTML = s.o.map(function(ci, pos){
      var c = data[ci], ok = ci === pos;
      var cls = 'fc' + (s.f === ci ? ' flagged' : '') + (s.v ? (ok ? ' ok' : ' ko') : '') + (movedCi === ci ? ' moved' : '');

          '<button type="button" class="flag" data-flag="' + ci + '" aria-pressed="' + (s.f === ci) + '" aria-label="' + L('Marquer comme point de non-retour', 'Flag as point of no return') + '"><svg><use href="#i-flag"/></svg></button>' +
        '</div></li>';
    }).join('');
    var sc = $('frs-' + id);
    if (s.v){
      var n = s.o.filter(function(ci, pos){ return ci === pos; }).length;
      sc.hidden = false;
      sc.innerHTML = '<b>' + n + ' / 8</b><span>' + L('cartes bien placées.', 'cards in the right place.') + '</span>' + (s.f >= 0 ? '<span>' + L('Point de non-retour retenu : carte ', 'Point of no return chosen: card ') + (s.f + 1) + L(' de la chronologie.', ' of the timeline.') + '</span>' : '<span>' + L('Placez maintenant le drapeau.', 'Now place the flag.') + '</span>');
    } else sc.hidden = true;
  }
  Object.keys(FR).forEach(function(id){
    FRS[id] = frLoad(id); frRender(id);
    var box = $('fr-' + id);
    box.addEventListener('pointerdown', function(e){
      var li = e.target.closest('.fc'); if (!li) return;

    box.addEventListener('click', function(e){
      var mv = e.target.closest('[data-mv]'), fl = e.target.closest('[data-flag]'), s = FRS[id];
